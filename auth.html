<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast Pro - Sign in</title>
    <meta name="description" content="Sign in or register to use SkyCast Pro weather tools">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <button id="themeToggle" aria-label="Toggle theme">🌙</button>

    <main class="auth-container">
        <section class="auth-card auth-card-page">
            <div class="top-section">
                <h1 class="app-title">☁ SkyCast Pro</h1>
                <p class="date">Your weather, in one clear view.</p>
            </div>

            <div id="messageBox" class="message d-none" role="alert"></div>

            <div class="auth-grid">
                <form class="auth-form" id="loginForm">
                    <h2>Sign in</h2>
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" placeholder="you@example.com" required>
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="Your password" required>
                    <button type="submit">Login</button>
                </form>

                <form class="auth-form" id="registerForm">
                    <h2>Create account</h2>
                    <label for="registerName">Name</label>
                    <input id="registerName" type="text" placeholder="Your name" required>
                    <label for="registerEmail">Email</label>
                    <input id="registerEmail" type="email" placeholder="you@example.com" required>
                    <label for="registerPassword">Password</label>
                    <input id="registerPassword" type="password" placeholder="At least 6 characters" minlength="6" required>
                    <button type="submit">Register</button>
                </form>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
</body>

</html>
